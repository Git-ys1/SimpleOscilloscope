[project]
name = "simple-scope-pc"
version = "0.4.0"
description = "Modular PySide6/PyQtGraph oscilloscope host for SimpleOscilloscope."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "PySide6>=6.11",
  "pyqtgraph>=0.14",
  "pyserial>=3.5",
]

[project.scripts]
simple-scope = "scope_app.main:main"
